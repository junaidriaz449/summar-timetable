<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm sunrise gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7C59F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCA3A;stop-opacity:1" />
    </linearGradient>
    <!-- Sun glow gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="42%" r="30%">
      <stop offset="0%" style="stop-color:#FFFDE7;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFD600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:0.8" />
    </radialGradient>
    <!-- Inner card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#FFF8E1;stop-opacity:0.95" />
    </linearGradient>
    <!-- Star/check glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#B45309" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- Decorative sparkles -->
  <!-- Top-left sparkle -->
  <g transform="translate(88, 80)" opacity="0.85">
    <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" fill="#FFFDE7"/>
  </g>
  <!-- Top-right sparkle -->
  <g transform="translate(424, 95)" opacity="0.75">
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="#FFFDE7"/>
  </g>
  <!-- Bottom-left sparkle -->
  <g transform="translate(72, 400)" opacity="0.6">
    <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" fill="#FFFDE7"/>
  </g>
  <!-- Bottom-right sparkle -->
  <g transform="translate(445, 385)" opacity="0.7">
    <polygon points="0,-12 2.5,-2.5 12,0 2.5,2.5 0,12 -2.5,2.5 -12,0 -2.5,-2.5" fill="#FFFDE7"/>
  </g>

  <!-- Sun rays (behind sun) -->
  <g transform="translate(256, 185)" filter="url(#glow)">
    <!-- 8 rays -->
    <line x1="0" y1="-95" x2="0" y2="-68" stroke="#FFD600" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <line x1="67" y1="-67" x2="48" y2="-48" stroke="#FFD600" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <line x1="95" y1="0" x2="68" y2="0" stroke="#FFD600" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <line x1="67" y1="67" x2="48" y2="48" stroke="#FFD600" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <line x1="-67" y1="-67" x2="-48" y2="-48" stroke="#FFD600" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <line x1="-95" y1="0" x2="-68" y2="0" stroke="#FFD600" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <line x1="-67" y1="67" x2="-48" y2="48" stroke="#FFD600" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <line x1="0" y1="95" x2="0" y2="68" stroke="#FFD600" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Sun circle -->
  <circle cx="256" cy="185" r="58" fill="url(#sunGrad)" filter="url(#softShadow)"/>

  <!-- Smiley face on sun -->
  <circle cx="238" cy="178" r="6" fill="#F57F17"/>
  <circle cx="274" cy="178" r="6" fill="#F57F17"/>
  <path d="M 238 198 Q 256 214 274 198" stroke="#F57F17" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- White card / calendar panel -->
  <rect x="118" y="290" width="276" height="168" rx="22" ry="22" fill="url(#cardGrad)" filter="url(#softShadow)"/>

  <!-- Calendar header strip -->
  <rect x="118" y="290" width="276" height="44" rx="22" ry="22" fill="#FF6B35"/>
  <rect x="118" y="312" width="276" height="22" fill="#FF6B35"/>

  <!-- Calendar header text dots (decorative) -->
  <circle cx="174" cy="312" r="5" fill="white" opacity="0.8"/>
  <circle cx="212" cy="312" r="5" fill="white" opacity="0.8"/>
  <circle cx="256" cy="312" r="5" fill="white" opacity="0.8"/>
  <circle cx="300" cy="312" r="5" fill="white" opacity="0.8"/>
  <circle cx="338" cy="312" r="5" fill="white" opacity="0.8"/>

  <!-- Checklist rows -->
  <!-- Row 1 - checked -->
  <rect x="144" y="350" width="22" height="22" rx="6" fill="#4ADE80"/>
  <polyline points="149,361 155,368 162,355" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="178" y="356" width="90" height="10" rx="5" fill="#D1FAE5"/>
  <rect x="278" y="356" width="50" height="10" rx="5" fill="#D1FAE5"/>

  <!-- Row 2 - checked -->
  <rect x="144" y="384" width="22" height="22" rx="6" fill="#4ADE80"/>
  <polyline points="149,395 155,402 162,389" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="178" y="390" width="110" height="10" rx="5" fill="#D1FAE5"/>
  <rect x="298" y="390" width="36" height="10" rx="5" fill="#D1FAE5"/>

  <!-- Row 3 - unchecked/pending -->
  <rect x="144" y="418" width="22" height="22" rx="6" fill="none" stroke="#FCA5A5" stroke-width="3"/>
  <rect x="178" y="424" width="80" height="10" rx="5" fill="#FEE2E2"/>
  <rect x="268" y="424" width="60" height="10" rx="5" fill="#FEE2E2"/>
</svg>
